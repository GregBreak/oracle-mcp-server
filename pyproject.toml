[project]
name = "oracle-mcp-server"
version = "0.1.5"
description = "MCP server for Oracle database schema context retrieval"
requires-python = ">=3.12"
dependencies = [
    "black==26.3.1",
    "mcp==1.23.0",
    "oracledb>=2.0.0",
    "pytest==9.0.3",
    "python-dotenv==1.2.2",
    "sqlparse==0.5.4",
]

[project.optional-dependencies]
dev = [
    "black",
    "mypy",
    "ruff",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0"
]

[tool.ruff]
select = ["E", "F", "I"]
line-length = 88

[tool.mypy]
python_version = "3.12"
strict = true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
